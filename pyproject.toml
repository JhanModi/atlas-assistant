[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-assistant"
version = "0.1.0"
description = "Atlas: a free, local, metrics-driven personal assistant built on Strands Agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "strands-agents[ollama,otel]>=1.64,<2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "apscheduler>=3.10,<4",
  "httpx>=0.27",
  "icalendar>=6",
  "recurring-ical-events>=3",
  "dateparser>=1.2",
  "sqlmodel>=0.0.22",
  "pydantic-settings>=2.4",
  "pyyaml>=6",
  "keyring>=25",
  "nh3>=0.2",
  "win11toast>=0.35; sys_platform == 'win32'",
]

[project.optional-dependencies]
evals = ["strands-agents-evals>=1.9"]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
atlas = "atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atlas = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
